name: Build APK (root shell)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          echo '' | base64 -d | gunzip > /tmp/p.patch
          git apply --verbose /tmp/p.patch
          git status --short
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --flavor arm64 --target-platform android-arm64
      - name: Collect
        run: |
          mkdir -p out
          cp "$(find app/build -name '*.apk' -type f | head -1)" out/dsh-go-root-arm64.apk
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-root-arm64
          path: out/*.apk
          if-no-files-found: error
